[project]
name = "littoral-naval-warfare-marl"
version = "0.1.0"
description = "A simplistic RL environment for littoral surface warfare"
authors = [
    {name = "Rich Wood",email = "31519720+rich95ftw@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipython (==8.12.3)",
    "matplotlib (==3.8.4)",
    "numpy (==1.23.1)",
    "pillow (==11.2.1)",
    "scikit-learn (==1.7.0)",
    "torch (==2.7.1)",
    "torchviz (==0.0.3)",
    "wandb (==0.20.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
